# Slack app manifest for docs0.
# Create the app: https://api.slack.com/apps -> Create New App -> From a manifest -> paste this file.
# Then: Basic Information -> App-Level Tokens -> generate a token with the scope
# connections:write (this is DOCS0_SLACK_APP_TOKEN, starts with xapp-), and
# Install App -> install to the workspace (the Bot User OAuth Token is DOCS0_SLACK_BOT_TOKEN, starts with xoxb-).
display_information:
  name: docs0
  description: Answers questions from your company's docs, with sources.
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: docs0
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - im:write
      - mpim:read
      - users:read
      - users:read.email
      - channels:join
      - reactions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
