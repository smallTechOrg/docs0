<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>docs0 admin fragments</title></head>
<body>
<!-- Shared by every admin page: the stylesheet and the top navigation. -->
<th:block th:fragment="styles">
  <style>
    :root { --bg:#f7f7f5; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --line:#e4e4df;
            --up:#1a7f4b; --off:#8a6d00; --down:#b3261e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#151514; --card:#1f1f1d; --text:#ecece8; --muted:#a0a09a; --line:#33332f;
              --up:#5fd08f; --off:#e0be4a; --down:#ff8a80; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width:760px; margin:0 auto; padding:32px 16px 48px; }
    h1 { font-size:22px; margin:0 0 4px; }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:28px 0 8px; }
    h3 { font-size:14px; margin:0; padding:12px 16px 0; }
    a { color:inherit; }
    p { margin:0 0 10px; }
    code { font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap:anywhere; }
    .sub { color:var(--muted); margin:0; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; }
    .pad { padding:14px 16px; }
    .pad > :last-child { margin-bottom:0; }
    .row { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; padding:12px 16px;
           border-top:1px solid var(--line); }
    .row:first-child { border-top:0; }
    .name { flex:1 1 180px; font-weight:600; overflow-wrap:anywhere; min-width:0; }
    .detail { flex:1 1 180px; color:var(--muted); overflow-wrap:anywhere; min-width:0; }
    .state { font-weight:600; font-size:13px; }
    .UP { color:var(--up); } .OFF { color:var(--off); } .DOWN { color:var(--down); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    form { margin:0; }
    button, .button { font:inherit; font-weight:600; font-size:14px; padding:7px 14px; border-radius:8px;
                      border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer;
                      text-decoration:none; display:inline-block; }
    .primary { background:var(--text); color:var(--bg); border-color:var(--text); }
    .danger { color:var(--down); }
    .msg { padding:12px 16px; margin-top:16px; border-left-width:4px; }
    .msg.notice { border-left-color:var(--up); }
    .msg.error { border-left-color:var(--down); }
    .crumbs { padding:12px 16px; border-bottom:1px solid var(--line); color:var(--muted); overflow-wrap:anywhere; }
    .empty { padding:12px 16px; color:var(--muted); }
    ol, ul { margin:0 0 10px; padding-left:20px; }
    nav.top { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; margin:0 0 20px; padding:0 0 10px;
              border-bottom:1px solid var(--line); }
    nav.top .brand { font-weight:700; margin-right:8px; text-decoration:none; }
    nav.top a { text-decoration:none; color:var(--muted); font-weight:600; }
    nav.top a.on { color:var(--text); border-bottom:2px solid var(--text); }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 0; }
    .tabs a { text-decoration:none; padding:6px 12px; border:1px solid var(--line); border-radius:8px;
              background:var(--card); font-weight:600; font-size:14px; }
    .tabs a.on { background:var(--text); color:var(--bg); border-color:var(--text); }
    .badge { font-size:12px; font-weight:700; padding:1px 8px; border-radius:99px; border:1px solid var(--line);
             color:var(--muted); white-space:nowrap; }
    .item { padding:14px 16px; border-top:1px solid var(--line); }
    .item:first-child { border-top:0; }
    .item p { margin:0 0 8px; overflow-wrap:anywhere; }
    .label { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.05em; display:block; }
    .quote { border-left:3px solid var(--line); padding-left:10px; white-space:pre-wrap; overflow-wrap:anywhere; }
    details { margin:0 0 8px; }
    details summary { cursor:pointer; color:var(--muted); overflow-wrap:anywhere; }
    details .quote { margin:8px 0 0; }
    textarea { width:100%; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
               background:var(--bg); color:var(--text); min-height:72px; resize:vertical; }
    .bar { height:12px; border-radius:6px; background:var(--line); overflow:hidden; margin:10px 0 6px; }
    .bar > div { height:100%; background:var(--up); }
    .bar.over > div { background:var(--down); }
    table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
    th, td { text-align:right; padding:8px 12px; border-top:1px solid var(--line); }
    th:first-child, td:first-child { text-align:left; }
    th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; border-top:0; }
    .scroll { overflow-x:auto; }
    .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  </style>
</th:block>

<nav class="top" th:fragment="nav(active)">
  <a class="brand" href="/">docs0</a>
  <a href="/admin/sources" th:classappend="${active == 'sources'} ? 'on'">Sources</a>
  <a href="/admin/channels" th:classappend="${active == 'channels'} ? 'on'">Channels</a>
  <a href="/admin/corrections" th:classappend="${active == 'corrections'} ? 'on'">Corrections</a>
  <a href="/admin/insights" th:classappend="${active == 'insights'} ? 'on'">Insights</a>
  <a href="/admin/costs" th:classappend="${active == 'costs'} ? 'on'">Costs</a>
</nav>
</body>
</html>
